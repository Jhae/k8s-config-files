spring:
  datasource:
    # url: jdbc:postgresql://localhost:5432/bdusuarios
    url: jdbc:postgresql://pg-usuarios-svc:5432/bdusuarios
    username: "${userbdusuarios}"
    password: "${passbdusuarios}"
    driver-class-name: org.postgresql.Driver
  
  # Azure Key Vault
  cloud:
    azure:
      keyvault:
        secret:
          property-sources:
            - name: "my-azure-keyvault"
              endpoint: "https://recado-kvault.vault.azure.net/"

# Logs
logging:
  level:
    org:
      springframework:
        security: DEBUG
        